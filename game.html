<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Девочка и шары</title>
<style>
  body { margin:0; display:flex; justify-content:center; align-items:center;
         min-height:100vh; background:linear-gradient(#ffd6e8,#fff0f5); font-family:sans-serif; }
  canvas { border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.2); }
</style>
</head>
<body>
<canvas id="c" width="640" height="400"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND = H - 50;          // уровень земли
const colors = ['#ff5a5a','#ffd93d','#6bcb77','#4d96ff','#c77dff'];

let girl, balloons, score, speed, over, spawnTimer, jumpTimer;

function reset() {
  girl   = { x: 100, y: GROUND, vy: 0, onGround: true };
  balloons = [];
  score = 0;
  speed = 5;
  spawnTimer = 0;
  over = false;
}
reset();

// Прыжок: пробел, стрелка вверх, клик мышью или тап
function jump() {
  if (over) { reset(); return; }
  if (girl.onGround) {
    girl.vy = -14;
    girl.onGround = false;
  }
}
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
cv.addEventListener('mousedown', jump);
cv.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

function update() {
  if (over) return;

  // физика прыжка
  girl.vy += 0.7;
  girl.y += girl.vy;
  if (girl.y >= GROUND) { girl.y = GROUND; girl.vy = 0; girl.onGround = true; }

  // шары появляются справа всё чаще и быстрее
  spawnTimer--;
  if (spawnTimer <= 0) {
    balloons.push({
      x: W + 30,
      r: 18 + Math.random() * 14,
      color: colors[Math.floor(Math.random() * colors.length)],
      bob: Math.random() * Math.PI * 2   // для покачивания вверх-вниз
    });
    spawnTimer = Math.max(50, 90 - score * 2);
    speed = Math.min(11, 5 + score * 0.15);
  }

  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    b.x -= speed;
    b.bob += 0.15;
    const by = GROUND - b.r - 8 + Math.sin(b.bob) * 6;

    // проверка столкновения: круг шара против девочки (примерный прямоугольник)
    const gx = girl.x, gy = girl.y;
    const cx = Math.max(gx - 18, Math.min(b.x, gx + 18));
    const cy = Math.max(gy - 95, Math.min(by, gy - 5));
    const dist2 = (b.x - cx) ** 2 + (by - cy) ** 2;
    if (dist2 < b.r * b.r) {
      over = true;
      return;
    }
    // пролетела мимо — очко
    if (b.x + b.r < girl.x - 20 && !b.passed) {
      b.passed = true;
      score++;
    }
    if (b.x < -b.r - 40) balloons.splice(i, 1);
  }
}

function draw() {
  // фон: небо, облака, земля
  ctx.fillStyle = '#bfe9ff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.arc(120, 70, 25, 0, 7); ctx.arc(155, 70, 30, 0, 7); ctx.arc(190, 70, 22, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(420, 100, 20, 0, 7); ctx.arc(450, 100, 26, 0, 7); ctx.arc(480, 100, 18, 0, 7); ctx.fill();
  ctx.fillStyle = '#8fd35f'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#7abf4e';
  for (let x = 0; x < W; x += 40) ctx.fillRect(x, GROUND, 20, 6);

  // шары с ниточками
  balloons.forEach(b => {
    const by = GROUND - b.r - 8 + Math.sin(b.bob) * 6;
    ctx.strokeStyle = '#666';
    ctx.beginPath(); ctx.moveTo(b.x, by + b.r); ctx.lineTo(b.x - 8, by + b.r + 22); ctx.stroke();
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, by, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(b.x - b.r/3, by - b.r/3, b.r/4, 0, 7); ctx.fill();
  });

  // девочка-блондинка (вид сбоку)
  const gx = girl.x, gy = girl.y;
  const jumpTilt = girl.onGround ? 0 : -0.15;   // в прыжке чуть наклонена вперёд
  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(jumpTilt);

  // ноги
  ctx.strokeStyle = '#e8a0bf'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-6, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(10, -4); ctx.stroke();

  // платье
  ctx.fillStyle = '#ff7bac';
  ctx.beginPath();
  ctx.moveTo(-14, -28); ctx.lineTo(-8, -62); ctx.lineTo(12, -62); ctx.lineTo(18, -28);
  ctx.closePath(); ctx.fill();

  // руки
  ctx.strokeStyle = '#ffe0bd'; ctx.lineWidth = 5;
  const armSwing = girl.onGround ? Math.sin(Date.now() / 90) * 6 : -10;
  ctx.beginPath(); ctx.moveTo(0, -56); ctx.lineTo(12, -40 + armSwing); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -56); ctx.lineTo(-10, -42 - armSwing); ctx.stroke();

  // голова
  ctx.fillStyle = '#ffe0bd';
  ctx.beginPath(); ctx.arc(4, -74, 12, 0, 7); ctx.fill();

  // светлые волосы + хвостик
  ctx.fillStyle = '#ffd966';
  ctx.beginPath(); ctx.arc(4, -76, 13, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-8, -70, 9, 5, -0.4, 0, 7); ctx.fill();

  // бант
  ctx.fillStyle = '#ff4d88';
  ctx.beginPath(); ctx.arc(-9, -80, 4, 0, 7); ctx.fill();

  // глаз и улыбка
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(9, -75, 2, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c94d7f'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(10, -70, 4, 0, Math.PI); ctx.stroke();

  ctx.restore();
  ctx.lineWidth = 1;

  // счёт
  ctx.fillStyle = '#333';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('Очки: ' + score, 15, 32);

  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText('Ой! Шарик!', W / 2, H / 2 - 20);
    ctx.font = '20px sans-serif';
    ctx.fillText('Очки: ' + score, W / 2, H / 2 + 15);
    ctx.fillText('Пробел или клик — сыграть ещё', W / 2, H / 2 + 50);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.font = '14px sans-serif';
    ctx.fillText('Пробел / ↑ / клик — прыжок', W - 190, 30);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
